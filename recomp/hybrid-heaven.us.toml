# N64Recomp configuration for Hybrid Heaven (USA), NHVE.
#
# Input: the assembly-only ELF built by tools/wsl_build_elf.sh from the expanded
# image, verified byte-identical in all 93 code segments (docs/findings/phase-01.md).
# Paths are relative to this file.

[input]

# ELF input mode (playbook 01): reference symbols and single-file patches need it.
elf_path = "../elf/hybrid-heaven.us.elf"

# Cartridge header +0x8, and the entry stub splat and the file table agree on.
entrypoint = 0x80000400

# Route every call through the runtime's function lookup.
#
# Overlays call into each other's windows directly: 15,251 jal sites land in
# another code file's address range, and some targets start a function in two
# files (tools/jal_audit.py). Only what is loaded at the time can say which is
# meant. The key is added by tools/patch_n64recomp.py (from Wave Race 64).
use_lookup_for_all_function_calls = true

output_func_path = "../RecompiledFuncs"

# ~16,000 functions: 200 per file keeps it to ~80 translation units.
functions_per_output_file = 200

# Declarations for the libultra functions N64Recomp delegates to the runtime
# (tools/gen_reimplemented_decls.py writes the header into RecompiledFuncs/).
recomp_include = """#include "recomp.h"
#include "reimplemented_decls.h""""

# Every code file from the Nisitenma-Ichigo table except the resident image:
# they share load addresses, and the runtime announces each one when the game's
# loader brings it in. Generated by tools/gen_splat_yaml.py.
relocatable_sections_path = "overlays.txt"

[patches]

stubs = [
    # cop0 Index/EntryHi/EntryLo/PageMask writes and tlbwi in a loop: a TLB reset.
    # Only osInitialize calls it, and osInitialize is the runtime's; the port has
    # no MMU (no TLB-mapped code, docs/findings/phase-00.md). N64Recomp cannot
    # translate cop0 register 10. Rayman 2 stubbed its TLB routines the same way.
    "func_800304A0_310A0",
]

ignored = [
]

# The audio manager's frame size (func_8001FD14, the __amHandleFrameMsg pattern of
# Nintendo's audio manager sample) is target + 0x100 - osAiGetLength()/4, masked
# to 16, then raised to the minimum with `sltu $at, $a3, $v1`. On hardware
# osAiGetLength never exceeds a frame, so the difference never goes negative. Here
# the host queue may hold more (the runtime keeps a few VIs in hand), the
# difference goes negative, the unsigned compare lets it past the clamp, and
# osAiSetNextBuffer receives -0x1000 bytes: the first boot of phase 04 crashed
# reading past RDRAM in queue_samples. A signed compare clamps it to the minimum.
# Goemon64Recomp (klorfmorf, GPL-3.0) documents and patches the same instruction in
# Mystical Ninja Starring Goemon's copy of this code; re-derived here from our own
# disassembly and HH_TRACE_AI (docs/findings/phase-04.md).
# The main loop's frame limiter polls osGetTime until enough time has passed
# (0x80001A88-0x80001B18) and never yields, which under ultramodern's
# cooperative scheduler starves every other game thread (phase 04: screen
# updates stopped ~30 s in). The hook runs before the loop's first instruction,
# the branch target of both back edges, so it runs once per iteration.
# src/spin_yield.cpp.
[[patches.hook]]
func = "func_80001454_2054"
before_vram = 0x80001A88
text = "{ void hh_yield_in_spin(uint8_t* rdram); hh_yield_in_spin(rdram); }"

[[patches.instruction]]
func = "func_8001FD14_20914"
vram = 0x8001FD8C
value = 0x00E3082A # sltu $at, $a3, $v1 -> slt $at, $a3, $v1

# The game's accessory classifier, func_80002BE0(channel), runs the Controller
# Pak check, then osMotorInit, then osGbpakInit, and a successful motor probe
# sets the answer to 7 ("Rumble Pak") so the Controller Pak is never classified.
# On hardware the slot holds one accessory. This port serves both on one slot
# (docs/PLAN.md D6, src/si_pak.cpp), and with the answer 7 a new game said "Rumble
# Pak is connected" and then "Start game without being able to save?"
# (docs/findings/phase-05.md). Dropping the assignment leaves the classifier's
# Controller Pak answer. The motor is still enabled where the game enables it,
# by func_80002A94's own osMotorInit call.
[[patches.instruction]]
func = "func_80002BE0_37E0"
vram = 0x80002C58
value = 0x00000000 # addiu $v1, $zero, 0x7 -> nop
